spring.application.name=Empleo_Spring

# ==========================================
# CONFIGURACION DEL SERVIDOR
# ==========================================
server.port=${PORT:8080}

# ==========================================
# CONEXION A BASE DE DATOS POSTGRESQL (RENDER)
# ==========================================
# IMPORTANTE: En local usar la URL externa; en Render usar la URL interna.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION JPA / HIBERNATE
# ==========================================
# 'update': actualiza el esquema sin borrar datos
# 'none': no hace nada con el esquema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURACION DE CORREO (GMAIL)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=stevenmestra3@gmail.com
spring.mail.password=sbzzspynwucffupt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Propiedad personalizada para el servicio de correo
app.mail.remitente=stevenmestra3@gmail.com

# ==========================================
# CONFIGURACION DEL POOL DE CONEXIONES (HikariCP)
# ==========================================
# Tiempo maximo de vida de una conexion (en milisegundos)
spring.datasource.hikari.max-lifetime=240000

# Tiempo maximo que una conexion puede estar inactiva (en ms)
spring.datasource.hikari.idle-timeout=120000

# Tiempo maximo de espera para obtener una conexion (en ms)
spring.datasource.hikari.connection-timeout=30000

# Consulta de validacion que HikariCP ejecuta antes de usar una conexion
spring.datasource.hikari.connection-test-query=SELECT 1

# Tamano minimo y maximo del pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10