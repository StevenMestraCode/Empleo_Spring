<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reporte por Nombre</title>
</head>
<body>
<h1>Reporte: Usuarios por Nombre</h1>

<form th:action="@{/usuarios/reporte/nombre}" method="get">
  <label>Nombre:</label>
  <input type="text" name="nombre" th:value="${nombreBuscado}"/>
  <button type="submit">Buscar</button>
</form>

<br>

<table border="1" cellpadding="10" cellspacing="0"
       th:if="${usuarios != null and !#lists.isEmpty(usuarios)}">
  <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th></tr>
  <tr th:each="u : ${usuarios}">
    <td th:text="${u.id}"></td>
    <td th:text="${u.nombre}"></td>
    <td th:text="${u.correo}"></td>
    <td th:text="${u.rol}"></td>
  </tr>
</table>

<p th:if="${usuarios != null and #lists.isEmpty(usuarios)}" style="color:red;">
  No se encontraron resultados.
</p>

<br>
<button type="button" th:onclick="|window.location.href='@{/usuarios}'|">Volver</button>
</body>
</html>
