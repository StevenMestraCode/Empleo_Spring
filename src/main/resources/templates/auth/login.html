<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
</head>
<body>
<h1>Iniciar Sesión</h1>

<div th:if="${param.error}" style="color:red;">Correo o clave incorrectos.</div>
<div th:if="${param.logout}" style="color:green;">Has cerrado sesión.</div>
<div th:if="${exito}" style="color:green;" th:text="${exito}"></div>
<div th:if="${error}" style="color:red;" th:text="${error}"></div>

<br>

<form th:action="@{/login}" method="post">
  <table cellpadding="8" cellspacing="0">
    <tr>
      <td><label for="username">Correo:</label></td>
      <td><input type="text" id="username" name="username" required autofocus/></td>
    </tr>
    <tr>
      <td><label for="password">Clave:</label></td>
      <td><input type="password" id="password" name="password" required/></td>
    </tr>
    <tr>
      <td colspan="2">
        <button type="submit">Ingresar</button>
      </td>
    </tr>
  </table>
</form>

<br>
<button type="button" th:onclick="|window.location.href='@{/recuperar}'|">¿Olvidaste tu contraseña?</button>
</body>
</html>
