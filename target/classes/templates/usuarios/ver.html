<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Usuario</title>
</head>
<body>
<h1 th:text="${titulo}">Detalle del Usuario</h1>

<table border="1" cellpadding="10" cellspacing="0">
    <tr><th>ID</th><td th:text="${usuario.id}"></td></tr>
    <tr><th>Nombre</th><td th:text="${usuario.nombre}"></td></tr>
    <tr><th>Correo</th><td th:text="${usuario.correo}"></td></tr>
    <tr><th>Rol</th><td th:text="${usuario.rol}"></td></tr>
</table>

<br>

<button type="button" th:onclick="|window.location.href='@{/usuarios}'|">Volver</button>
</body>
</html>
