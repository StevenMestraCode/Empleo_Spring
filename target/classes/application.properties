spring.application.name=Empleo_Spring

# ==========================================
# CONFIGURACION DEL SERVIDOR
# ==========================================
server.port=${PORT:8080}

# ==========================================
# CONEXION A BASE DE DATOS POSTGRESQL (RENDER)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURACION DE CORREO (RESEND API)
# ==========================================
# La API Key se lee desde la variable de entorno RESEND_API
resend.api.key=${RESEND_API}
resend.api.url=https://api.resend.com/emails
resend.from=onboarding@resend.dev

# ==========================================
# CONFIGURACION DEL POOL DE CONEXIONES (HikariCP)
# ==========================================
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10